name: Self-Heal Repair

on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      (!startsWith(github.ref_name, 'selfheal-') && github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for duplicate Self-Heal PRs
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close stale PRs older than 7 days
          stale_prs=$(gh pr list --label "self-heal" --state open --json number,createdAt -q '.[] | select(.createdAt < (now - 604800 | todate)) | .number')
          for pr in $stale_prs; do
            gh pr close $pr --comment "Closing stale self-heal PR"
          done

          # Check for open PRs
          open_prs=$(gh pr list --label "self-heal" --state open --json number -q '.[].number')
          if [ -n "$open_prs" ]; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
            echo "Found open self-heal PRs: $open_prs. Skipping run."
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Pre-Healthcheck
        if: steps.check_pr.outputs.duplicate != 'true'
        id: pre_healthcheck
        continue-on-error: true
        run: node scripts/healthcheck.mjs > pre_healthcheck.log 2>&1

      - name: Run Repair Script
        if: steps.check_pr.outputs.duplicate != 'true'
        id: repair_script
        continue-on-error: true
        run: node scripts/self_heal.mjs > repair.log 2>&1

      - name: Run Post-Healthcheck
        if: always() && steps.check_pr.outputs.duplicate != 'true'
        id: post_healthcheck
        continue-on-error: true
        run: node scripts/healthcheck.mjs > post_healthcheck.log 2>&1

      - name: Upload Logs
        if: always() && steps.check_pr.outputs.duplicate != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-logs
          path: |
            pre_healthcheck.log
            repair.log
            post_healthcheck.log

      - name: Check Gates and Diff
        if: always() && steps.check_pr.outputs.duplicate != 'true' && steps.post_healthcheck.outcome == 'success'
        id: evaluate_gates
        run: |
          git add -A

          # Diff checking
          if git diff --cached --quiet; then
            echo "No diff found. Exiting."
            echo "create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Exclude forbidden paths
          if git diff --cached --name-only | grep -E '(\.github/workflows/ci\.yml|\.env|secrets/)'; then
            echo "Forbidden files modified. Exiting."
            exit 1
          fi

          # Secret scanning
          if git diff --cached | grep -q 'secret'; then
            echo "Possible secrets found in diff. Exiting."
            exit 1
          fi

          echo "create_pr=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.evaluate_gates.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine PR Title based on event
          if [ "${{ github.event_name }}" == "schedule" ]; then
            TITLE="[Self-Heal Scheduled] Drift fixes"
            REASON="Proactive schedule run"
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            TITLE="[Self-Heal Reactive] CI fix"
            REASON="Reacting to CI failure in run ${{ github.event.workflow_run.id }}"
          else
            TITLE="[Self-Heal Manual] Repair"
            REASON="Manual dispatch trigger"
          fi

          BRANCH_NAME="selfheal-$(date +%s)"
          git commit -m "$TITLE"
          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME

          cat <<EOF > pr_body.txt
          ## 🤖 Self-Heal Automation

          **Trigger Reason:** $REASON

          This PR contains automated fixes generated by the self-healing pipeline.

          ### Checks:
          - ✅ Post-healthcheck passed
          - ✅ No forbidden files modified
          - ✅ No secrets detected

          ### Logs:
          Check the [Workflow Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the downloaded artifacts (\`pre_healthcheck.log\`, \`repair.log\`, \`post_healthcheck.log\`).
          EOF

          gh pr create --title "$TITLE" --body-file pr_body.txt --label "self-heal" --label "automation" --base main
