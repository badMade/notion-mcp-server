name: Self-Heal Repair

on:
  schedule:
    - cron: '0 0 * * 1' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    conclusion: ["failure"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!startsWith(github.ref_name, 'selfheal-')"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Auto-close stale selfheal PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --label self-heal --state open --json number,createdAt | jq -r '.[] | select(.createdAt < (now - 604800 | todate)) | .number' | xargs -I {} gh pr close {} || true

      - name: Duplicate PR Check
        id: dup_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECENT_PRS=$(gh pr list --label self-heal --state open --json createdAt -q 'length' || echo "0")
          if [ "$RECENT_PRS" -gt "0" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Pre-healthcheck
        if: steps.dup_check.outputs.skip != 'true'
        id: pre_health
        continue-on-error: true
        run: node scripts/healthcheck.mjs > pre_healthcheck.log 2>&1

      - name: Run Self-Heal Pipeline
        if: steps.dup_check.outputs.skip != 'true'
        id: repair_pipeline
        continue-on-error: true
        run: node scripts/self_heal.mjs > repair_pipeline.log 2>&1

      - name: Post-healthcheck
        if: always() && steps.repair_pipeline.outcome == 'success'
        id: post_health
        run: node scripts/healthcheck.mjs > post_healthcheck.log 2>&1

      - name: Gate Checks & PR Creation
        if: always() && steps.post_health.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          if [ -n "$(git status --porcelain | grep -v "\.log$")" ]; then
            if git diff --cached | grep -iE '([Ss]ecret|[Tt]oken|[Aa]pi[_-]key|[Pp]assword)[\s]*[:=]' || git diff --cached | grep -q 'sk-[a-zA-Z0-9]\{20,\}'; then
              exit 1
            fi

            git diff --cached --name-only | while read file; do
              if [[ "$file" != src/* && "$file" != tests/* && "$file" != "package.json" && "$file" != "package-lock.json" && "$file" != eslint.config.mjs ]]; then
                # only allow specific directories/files to prevent modifying arbitrary stuff outside of self-heal scope
                exit 1
              fi
            done

            BRANCH_NAME="selfheal-repair-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git commit -m "auto: self-healing repair"
            git push origin "$BRANCH_NAME"

            if [ "${{ github.event_name }}" == "schedule" ]; then
              TITLE="[Self-Heal Scheduled] Drift fixes"
            elif [ "${{ github.event_name }}" == "workflow_run" ]; then
              TITLE="[Self-Heal Reactive] CI fix"
            else
              TITLE="[Self-Heal Manual] Repair"
            fi

            gh pr create --title "$TITLE" --body "Automated self-healing repair triggered by ${{ github.event_name }}. \n\n[View Artifact Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nGenerated by Claude Code / Jules coding agent." --label "automation,self-heal"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-logs
          path: |
            pre_healthcheck.log
            repair_pipeline.log
            post_healthcheck.log
