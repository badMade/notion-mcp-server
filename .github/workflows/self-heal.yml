name: Self-Heal Pipeline

on:
  schedule:
    - cron: '0 5 * * 1' # AUTO-UPDATED
  workflow_dispatch:
  workflow_run:
    workflows: ["PR Review"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-heal:
    # Only run scheduled triggers on the default branch; reactive triggers can be on PRs
    # Skip if loop prevention matches branch name
    if: >
      (!startsWith(github.ref_name, 'selfheal-')) &&
      ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || github.event_name != 'schedule') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for open Self-Heal PRs
        id: check_prs
        run: |
          OPEN_PRS=$(gh pr list --label self-heal --state open --json number -q 'length')
          if [ "$OPEN_PRS" -gt "0" ]; then
            echo "Open selfheal PR detected. Skipping to avoid duplicates."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}

      - name: Clean up stale PRs
        if: steps.check_prs.outputs.continue == 'true'
        run: |
          # Cleanup stale PRs older than 7 days
          gh pr list --label self-heal --state open --json number,createdAt | jq -r '.[] | select((.createdAt | fromdateiso8601) < (now - 604800)) | .number' | xargs -I {} gh pr close {} --comment "Auto-closing stale self-heal PR" || true
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}

      - name: Install initial dependencies
        if: steps.check_prs.outputs.continue == 'true'
        run: npm ci

      - name: Run Initial Healthcheck
        if: steps.check_prs.outputs.continue == 'true'
        id: pre_healthcheck
        run: node scripts/healthcheck.mjs > pre_healthcheck.log 2>&1 || true
        continue-on-error: true

      - name: Run Self-Heal Repair Pipeline
        if: steps.check_prs.outputs.continue == 'true'
        id: repair
        run: node scripts/self_heal.mjs > repair_pipeline.log 2>&1 || true
        continue-on-error: true

      - name: Verify Git Status and Secrets
        if: steps.check_prs.outputs.continue == 'true' && steps.repair.outcome == 'success'
        id: verify_gate
        run: |
          git add .
          DIFF=$(git diff --cached --name-only)
          if [ -z "$DIFF" ]; then
             echo "No diff generated, skipping PR creation."
             echo "valid=false" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          echo "Diff exists."

          # Allowed files check
          DENIED_FILES=$(git diff --cached --name-only | grep -iE '(\.env|secrets/|migrations/)' || true)
          if [ ! -z "$DENIED_FILES" ]; then
             echo "Diff contains denied files (e.g., .env or secrets): $DENIED_FILES"
             echo "valid=false" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          # Secret Scanning check
          SECRET_MATCH=$(git diff --cached | grep -iE 'token=|api_key|secret|password' || true)
          if [ ! -z "$SECRET_MATCH" ]; then
             echo "Potential secrets detected in diff. Aborting."
             echo "valid=false" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-logs
          path: |
            *.log
          retention-days: 7

      - name: Create Pull Request
        if: steps.check_prs.outputs.continue == 'true' && steps.verify_gate.outputs.valid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="selfheal-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: apply self-healing repairs"
          git push -u origin "$BRANCH_NAME"

          TRIGGER_NAME="Manual"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIGGER_NAME="Scheduled"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TRIGGER_NAME="Reactive"
          fi

          TITLE="[Self-Heal $TRIGGER_NAME] Auto-Repair Drift and CI Failures"
          BODY="This PR was automatically generated by the Self-Heal Coding Agent.

          **Trigger:** $TRIGGER_NAME
          **Action:** Ran idempotent repair scripts \`scripts/self_heal.mjs\` to resolve code drift.\n          \n          **Artifact Logs:** Please check the [Actions run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the uploaded `self-heal-logs` artifact to see the pre/post healthcheck and repair details.

          Please review the changes carefully to ensure they match expectations."

          gh pr create --title "$TITLE" --body "$BODY" --label "self-heal,automation" --head "$BRANCH_NAME" --base main
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
