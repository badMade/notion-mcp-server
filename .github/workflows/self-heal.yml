name: Self-Heal Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch') &&
      !startsWith(github.ref_name, 'selfheal-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for existing Self-Heal PRs
        id: check_prs
        run: |
          open_prs=$(gh pr list --label self-heal --state open --json number --jq 'length' || echo "0")
          if [ "$open_prs" -gt "0" ]; then
            echo "open_prs_exist=true" >> $GITHUB_OUTPUT
            echo "Skipping repair as there are open self-heal PRs."
          else
            echo "open_prs_exist=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pre-repair healthcheck
        id: pre_check
        if: steps.check_prs.outputs.open_prs_exist == 'false'
        continue-on-error: true
        run: |
          ./scripts/healthcheck.mjs
          if [ $? -eq 0 ]; then
            echo "pre_healthcheck_passed=true" >> $GITHUB_OUTPUT
          else
            echo "pre_healthcheck_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Self-Heal Logic
        id: self_heal
        if: steps.check_prs.outputs.open_prs_exist == 'false'
        continue-on-error: true
        run: |
          ./scripts/self_heal.mjs

      - name: Verify Post-Repair Health
        id: post_check
        if: steps.self_heal.outcome == 'success'
        continue-on-error: true
        run: |
          ./scripts/healthcheck.mjs

      - name: Verify Changes & Scan Secrets
        id: verify_changes
        if: steps.post_check.outcome == 'success'
        run: |
          git add .

          # Secret scanning check
          ! git diff --cached | grep -iE '(secret|token|password|key)' || {
             echo "Error: Potentially sensitive patterns found in diff."
             exit 1
          }

          # Bound check allowed files
          changes=$(git diff --name-only --cached)
          for file in $changes; do
            if [[ "$file" == .github/workflows/ci.yml || "$file" == .env* ]]; then
               echo "Error: Modified forbidden file: $file"
               exit 1
            fi
          done

          if [ -n "$changes" ]; then
             echo "has_changes=true" >> $GITHUB_OUTPUT
          else
             echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify_changes.outcome == 'success' && steps.verify_changes.outputs.has_changes == 'true'
        run: |
          branch_name="selfheal-$(date +%s)"
          git checkout -b "$branch_name"
          git commit -m "chore(self-heal): auto-repair pipeline fixes"
          git push -u origin "$branch_name"

          trigger_reason="Scheduled"
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            trigger_reason="Reactive (CI Failure)"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            trigger_reason="Manual"
          fi

          gh pr create \
            --title "[Self-Heal $trigger_reason] Auto-repair fixes" \
            --body "This PR was automatically generated by the self-healing pipeline due to a $trigger_reason trigger. Please review the changes." \
            --label "self-heal" \
            --label "automation"
        env:
          # A token with workflow scope is required if the PR might touch workflows (though this job prevents ci.yml touch, it might touch self-heal.yml)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
