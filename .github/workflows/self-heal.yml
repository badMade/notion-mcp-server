name: Self-Heal Repair
on:
  schedule:
    - cron: '0 3 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    if: >
      ((github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch')) &&
      !startsWith(github.ref_name, 'selfheal-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clean stale PRs
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [ -n "$GH_TOKEN" ]; then
             for pr in $(gh pr list --label self-heal --state open --json number,createdAt | jq -r '.[] | select(.createdAt < (now - 604800 | todate)) | .number'); do
               gh pr close $pr --comment "Auto-closing stale self-heal PR"
             done
          fi
        continue-on-error: true
      - name: Dup PR Check
        id: dup
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          if [ -n "$GH_TOKEN" ]; then
            count=$(gh pr list --label self-heal --state open --json number | jq length)
            echo "count=$count" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi
      - name: Pre-healthcheck
        id: pre
        run: node scripts/healthcheck.mjs > pre-healthcheck.log 2>&1 || echo "failed=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Auto-repair
        id: repair
        if: steps.dup.outputs.count == '0' || steps.dup.outputs.count == ''
        run: node scripts/self_heal.mjs > repair.log 2>&1
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: self-heal-logs
          path: |
            pre-healthcheck.log
            repair.log
      - name: Create PR
        if: steps.repair.outcome == 'success' && (steps.dup.outputs.count == '0' || steps.dup.outputs.count == '')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          # Verify files
          if git diff --cached --name-only | grep -qE '^\.github/workflows/ci\.yml$|^\.env|secrets/|migrations/'; then exit 1; fi
          git diff --cached | grep -iE 'api[_-]?key|secret|token|password' > /dev/null 2>&1 && exit 1 || true

          if [ -n "$(git status --porcelain)" ]; then
            branch="selfheal-$(date +%s)"
            git checkout -b $branch
            git commit -m "chore: auto-repair drift and CI failures"

            TITLE="[Self-Heal Manual] Repair"
            if [ "${{ github.event_name }}" == "schedule" ]; then TITLE="[Self-Heal Scheduled] Drift fixes"; fi
            if [ "${{ github.event_name }}" == "workflow_run" ]; then TITLE="[Self-Heal Reactive] CI fix"; fi

            gh pr create --title "$TITLE" --body "Automated repair by self-heal pipeline. Logs: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --label "automation,self-heal" --head $branch
          fi