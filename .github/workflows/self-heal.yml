name: Self-Heal
on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: |
      github.repository == github.repository &&
      !startsWith(github.ref_name, 'selfheal-') &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
      ) &&
      (github.event_name != 'schedule' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Close stale selfheal PRs
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE || secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --label "self-heal" --state open --json number,updatedAt -q '.[] | select((now - (.updatedAt | fromdateiso8601)) > 604800) | .number' | xargs -I {} gh pr close {} --comment "Closing stale selfheal PR"

      - name: Check for recent open selfheal PRs
        id: check_pr
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE || secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --label "self-heal" --state open --json number -q 'length')
          if [ "$OPEN_PRS" -gt "0" ]; then
            echo "Open selfheal PRs exist. Skipping to avoid duplicates."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Self-Heal
        if: steps.check_pr.outputs.skip == 'false'
        id: repair_step
        continue-on-error: true
        run: |
          npm ci
          chmod +x scripts/self_heal.mjs scripts/healthcheck.mjs
          node scripts/self_heal.mjs > repair.log 2>&1

      - name: Check Diff & Boundaries
        if: steps.check_pr.outputs.skip == 'false' && steps.repair_step.outcome == 'success'
        id: verify_diff
        run: |
          if ! git diff --cached --quiet || ! git diff --quiet; then
            echo "diff_exists=true" >> $GITHUB_OUTPUT
            git add .
            if git diff --cached | grep -iE 'apikey|api_key|token|secret'; then
              echo "Secrets detected in diff! Aborting."
              exit 1
            fi

            git diff --cached --name-only > changes.txt
            while IFS= read -r file; do
              if [[ ! "$file" =~ ^(src/|scripts/|tests/|package\.json|package-lock\.json|tsconfig\.json|eslint\.config\.mjs) ]]; then
                echo "Modified unapproved path: $file. Aborting."
                exit 1
              fi
            done < changes.txt
          else
            echo "diff_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-logs
          path: repair.log

      - name: Create PR
        if: steps.check_pr.outputs.skip == 'false' && steps.repair_step.outcome == 'success' && steps.verify_diff.outputs.diff_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="selfheal-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git commit -m "Auto-repair drift"
          git push -u origin $BRANCH_NAME

          TITLE="[Self-Heal] Repair drift"
          if [ "${{ github.event_name }}" == "schedule" ]; then TITLE="[Self-Heal Scheduled] Drift fixes"; fi
          if [ "${{ github.event_name }}" == "workflow_run" ]; then TITLE="[Self-Heal Reactive] CI fix"; fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then TITLE="[Self-Heal Manual] Repair"; fi

          SCHEDULE_INFO=$(cat .github/self-heal-schedule.yml)

          gh pr create --title "$TITLE" \
            --body "Auto-generated PR from self-healing pipeline. Trigger: ${{ github.event_name }}.

            ### Schedule Rationale
            \`\`\`yaml
            $SCHEDULE_INFO
            \`\`\`

            Logs can be found in the workflow artifacts." \
            --label "automation,self-heal"
