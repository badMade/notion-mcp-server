name: Self-Heal Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.ref_name, 'selfheal-') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure') &&
      github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Close stale PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --label self-heal --state open --json number,createdAt | jq -r '.[] | select((now - (.createdAt | fromdateiso8601)) > 604800) | .number' | xargs -I {} gh pr close {} || true

      - name: Check duplicates
        id: check_dup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --label self-heal --state open --json number | jq length)
          if [ "$COUNT" -gt 0 ]; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
          fi

      - name: Pre Healthcheck
        id: pre
        continue-on-error: true
        run: node scripts/healthcheck.mjs > pre_healthcheck.log 2>&1

      - name: Run Repair
        id: repair
        if: steps.check_dup.outputs.duplicate != 'true'
        continue-on-error: true
        run: node scripts/self_heal.mjs > repair.log 2>&1

      - name: Post Healthcheck
        id: post
        if: always() && steps.repair.outcome != 'success'
        continue-on-error: true
        run: node scripts/healthcheck.mjs > post_healthcheck.log 2>&1

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-logs
          path: '*.log'

      - name: Gate Checks & Create PR
        if: always() && steps.post.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain | grep -v '\.log$')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/ tests/ package.json package-lock.json || true
            if [ -n "$(git status --porcelain)" ]; then
              git diff --cached | grep -q -iE 'token|secret|password|sk-' && exit 1 || true
              BRANCH="selfheal-$(date +%s)"
              git checkout -b $BRANCH
              git commit -m "chore: self-healing repairs"
              git push origin $BRANCH
              TITLE="[Self-Heal Reactive] CI fix"
              if [ "${{ github.event_name }}" == "schedule" ]; then TITLE="[Self-Heal Scheduled] Drift fixes"; fi
              if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then TITLE="[Self-Heal Manual] Repair"; fi
              gh pr create --title "$TITLE" --body "Automated repair based on telemetry. See logs in [Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." --label "self-heal"
            fi
          fi
