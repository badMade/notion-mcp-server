name: Self-Heal Repair

on:
  schedule:
    - cron: '0 3 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    if: |
      !startsWith(github.ref_name, 'selfheal-') &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean up old PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep selfheal PRs older than 7 days tidy
          gh pr list --label "self-heal" --state open --json number,createdAt --jq '.[] | select(.createdAt < (now - 604800 | todate)) | .number' | xargs -I {} gh pr close {} --comment "Auto-closing stale self-heal PR" || true

      - name: Pre-healthcheck
        id: pre_health
        run: node scripts/healthcheck.mjs > pre_healthcheck.log 2>&1 || true

      - name: Run Repair Sequence
        id: repair_step
        run: node scripts/self_heal.mjs > repair.log 2>&1
        continue-on-error: true

      - name: Post-healthcheck
        id: post_health
        if: always()
        run: node scripts/healthcheck.mjs > post_healthcheck.log 2>&1

      - name: Check Diff
        if: always()
        id: check_diff
        run: |
          if [ -n "$(git status --porcelain | grep -v '\.log$')" ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi

      - name: Gate Evaluation & PR Creation
        if: always() && steps.post_health.outcome == 'success' && steps.check_diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Duplicate PR check
          EXISTING_PRS=$(gh pr list --label "self-heal" --state open --json number | jq length)
          if [ "$EXISTING_PRS" -gt 0 ]; then
             echo "An open self-heal PR already exists. Skipping creation to avoid duplicates."
             exit 0
          fi

          # Gate: File bounds check
          git add -A

          # Only allowed files
          if git diff --cached --name-only | grep -vE 'src/|tests/snapshots/|package\.json|package-lock\.json|scripts/|\.github/self-heal-schedule\.yml'; then
             echo "Forbidden files changed (only allowed paths). Aborting."
             exit 1
          fi

          # Explicit forbidden check
          if git diff --cached --name-only | grep -E '\.github/workflows/ci\.yml|\.env|secrets/'; then
             echo "Forbidden files changed. Aborting."
             exit 1
          fi

          # Gate: Secret check
          if git diff --cached | grep -qiE 'api[_-]?key|secret|token|password'; then
             echo "Possible secrets in diff. Aborting."
             exit 1
          fi

          BRANCH_NAME="selfheal-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git commit -m "Auto-repair: resolved drift and CI failures"
          git push -u origin $BRANCH_NAME

          TITLE="[Self-Heal] "
          if [ "${{ github.event_name }}" = "schedule" ]; then
             TITLE="${TITLE}Scheduled Drift fixes"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
             TITLE="${TITLE}Reactive CI fix"
          else
             TITLE="${TITLE}Manual Repair"
          fi

          BODY="Automated self-heal PR triggered by ${{ github.event_name }}.

          ### Trigger Reason
          Triggered by ${{ github.event_name }} to auto-repair CI failures or drift.

          ### Rationale
          Computed based on telemetry (tier: standard).

          ### Drift Summary
          Fixes generated by automated pipeline.

          Please review the changes and check the workflow artifacts for detailed logs."

          gh pr create --title "$TITLE" --body "$BODY" --label "automation,self-heal" --head $BRANCH_NAME --base main

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-logs
          path: |
            pre_healthcheck.log
            repair.log
            post_healthcheck.log