name: Self-Heal Repair

on:
  schedule:
    - cron: '0 0 * * 1' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: |
      !startsWith(github.ref_name, 'selfheal-') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    steps:
      - name: Auto-close stale PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close PRs older than 7 days (604800 seconds)
          NOW=$(date +%s)
          gh pr list --label self-heal --state open --json number,createdAt | jq -r ".[] | select(($NOW - ( .createdAt | fromdateiso8601 )) > 604800) | .number" | xargs -I {} gh pr close {} -c "Auto-closing stale self-heal PR older than 7 days" || true

      - name: Check branch
        if: github.event_name == 'schedule' && github.ref_name != 'main'
        run: exit 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify no open duplicate PRs
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --label self-heal --state open --json createdAt -q 'length' || echo 0)
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Healthcheck Pre
        id: pre_healthcheck
        if: steps.check_pr.outputs.duplicate != 'true'
        run: |
          chmod +x scripts/healthcheck.mjs
          ./scripts/healthcheck.mjs > pre_healthcheck.log 2>&1
        continue-on-error: true

      - name: Run Repair Steps
        id: repair_steps
        if: steps.check_pr.outputs.duplicate != 'true'
        run: |
          chmod +x scripts/self_heal.mjs
          ./scripts/self_heal.mjs > repair.log 2>&1

      - name: Run Healthcheck Post
        id: post_healthcheck
        if: steps.check_pr.outputs.duplicate != 'true'
        run: |
          ./scripts/healthcheck.mjs > post_healthcheck.log 2>&1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.check_pr.outputs.duplicate != 'true'
        with:
          name: self-heal-logs
          path: |
            pre_healthcheck.log
            repair.log
            post_healthcheck.log
          retention-days: 7

      - name: Check Diff & Gate
        id: gate
        if: steps.check_pr.outputs.duplicate != 'true' && steps.post_healthcheck.outcome == 'success'
        run: |
          git add .
          DIFF=$(git status --porcelain)
          if [ -z "$DIFF" ]; then
            echo "No changes"
            echo "diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --cached | grep -iE 'apikey|api_key|token|secret'; then
            echo "Secrets detected!"
            exit 1
          fi

          CHANGED_FILES=$(git diff --cached --name-only)
          for file in $CHANGED_FILES; do
             if echo "$file" | grep -qE '\.env|secrets/|\.github/workflows/ci\.yml|migrations/'; then
               echo "Denied file changed: $file"
               exit 1
             fi
          done

          echo "diff=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.gate.outputs.diff == 'true' && steps.post_healthcheck.outcome == 'success' && steps.check_pr.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="selfheal-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Auto-repair changes"
          git push origin "$BRANCH_NAME"

          TITLE="[Self-Heal] Auto-repair"
          if [ "${{ github.event_name }}" == "schedule" ]; then
            TITLE="[Self-Heal Scheduled] Drift fixes"
            TRIGGER_REASON="Proactive scheduled run based on computed telemetry."
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            TITLE="[Self-Heal Reactive] CI fix"
            TRIGGER_REASON="Reactive run due to a CI failure."
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TITLE="[Self-Heal Manual] Repair"
            TRIGGER_REASON="Manually dispatched repair run."
          fi

          DRIFT_SUMMARY=$(git diff --cached --stat || echo "No summary available")
          RUN_LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PR_BODY="### Auto-generated PR from self-heal pipeline.\n\n**Trigger Reason:** $TRIGGER_REASON\n\n**Drift Summary:**\n\`\`\`\n$DRIFT_SUMMARY\n\`\`\`\n\n**Artifact Logs:** [View Logs in Actions Run]($RUN_LINK)\n\n**Current Schedule Rationale:** See \`.github/self-heal-schedule.yml\` for the active computed schedule and its rationale."

          gh pr create \
            --title "$TITLE" \
            --body "$(echo -e "$PR_BODY")" \
            --label "automation,self-heal" \
            --head "$BRANCH_NAME"
