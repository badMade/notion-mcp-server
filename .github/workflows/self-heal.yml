name: Self-Heal Repair
on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_dispatch:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    if: >-
      (github.event_name == 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard against loops
        if: startsWith(github.ref_name, 'selfheal-')
        run: |
          echo "Loop detected on selfheal-* branch. Exiting."
          exit 0

      - name: Close stale selfheal PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --label self-heal --state open --json number,createdAt -q '.[] | select(.createdAt < (now - 604800 | todate)) | .number' | while read pr_number; do
            gh pr close $pr_number --comment "Auto-closing stale self-heal PR."
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Pre-healthcheck
        id: pre_healthcheck
        run: node scripts/healthcheck.mjs
        continue-on-error: true

      - name: Run repair pipeline
        id: repair
        run: node scripts/self_heal.mjs
        continue-on-error: true

      - name: Post-healthcheck
        id: post_healthcheck
        run: node scripts/healthcheck.mjs
        continue-on-error: true

      - name: Verify conditions and gates
        id: gates
        if: steps.post_healthcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No diff generated. Exiting."
            exit 0
          fi

          git add .
          if git diff --cached -S 'secret' -S 'token' -S 'password' -S 'apikey' --name-only | grep .; then
            echo "Potential secrets in diff. Aborting."
            exit 1
          fi

          git diff --cached --name-only > changes.txt
          while read file; do
            if [[ "$file" == .github/workflows/ci.yml ]] || [[ "$file" == .env ]] || [[ "$file" == secrets/* ]] || [[ "$file" == src/**/migrations/* ]]; then
              echo "Changes in denylisted path: $file. Aborting."
              exit 1
            fi
            if ! [[ "$file" == src/* ]] && ! [[ "$file" == scripts/* ]] && ! [[ "$file" == *__tests__/* ]] && ! [[ "$file" == package.json ]] && ! [[ "$file" == package-lock.json ]] && ! [[ "$file" == eslint.config.mjs ]] && ! [[ "$file" == .github/workflows/self-heal.yml ]] && ! [[ "$file" == .github/workflows/compute-schedule.yml ]] && ! [[ "$file" == .github/self-heal-schedule.yml ]]; then
              echo "Changes outside allowlisted paths: $file. Aborting."
              exit 1
            fi
          done < changes.txt

          if gh pr list --label self-heal --state open --json number -q '. | length' | grep -q -v '^0$'; then
            echo "Open self-heal PR already exists. Aborting."
            exit 1
          fi

          echo "gate_passed=true" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.post_healthcheck.outcome == 'success' && steps.gates.outputs.gate_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch_name="selfheal-$(date +%s)"
          git checkout -b $branch_name
          git commit -m "Auto-repair drift and CI failures"
          git push -u origin $branch_name

          TRIGGER_REASON="${{ github.event_name }}"
          TITLE="[Self-Heal Reactive] CI fix"
          if [ "$TRIGGER_REASON" == "schedule" ]; then
            TITLE="[Self-Heal Scheduled] Drift fixes"
          elif [ "$TRIGGER_REASON" == "workflow_dispatch" ]; then
            TITLE="[Self-Heal Manual] Repair"
          fi

          gh pr create --title "$TITLE" --body "Automated repair PR. Reason: $TRIGGER_REASON. Review carefully." --label "automation,self-heal"