name: Self-Heal Auto Repair

on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.ref_name == 'main' &&
      !startsWith(github.ref_name, 'selfheal-') &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Git setup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cleanup Stale PRs
        run: |
          gh pr list --label self-heal --state open --json number,createdAt | jq -c '.[]' | while read i; do
            CREATED=$(echo $i | jq -r .createdAt)
            NUM=$(echo $i | jq -r .number)
            if [ $(date -d "$CREATED" +%s) -lt $(date -d "7 days ago" +%s) ]; then
              gh pr close $NUM -c "Auto-closing stale self-heal PR"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-healthcheck
        id: pre
        run: ./scripts/healthcheck.mjs > pre-healthcheck.log 2>&1 || true

      - name: Run repair sequence
        id: repair
        run: ./scripts/self_heal.mjs > repair.log 2>&1
        continue-on-error: true

      - name: Post-healthcheck
        id: post
        run: ./scripts/healthcheck.mjs > post-healthcheck.log 2>&1

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-logs
          path: |
            pre-healthcheck.log
            repair.log
            post-healthcheck.log

      - name: Check for duplicate PR
        id: dupe
        run: |
          if gh pr list --label self-heal --state open --json createdAt --jq 'length' | grep -q '^[1-9]'; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Diff & Boundaries
        id: check
        run: |
          # Gate: Ensure non-empty diff ignoring log files
          if [ -z "$(git status --porcelain | grep -v '\.log$')" ]; then
            echo "No diff generated."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Gate: No secrets in diff
          git add .
          if git diff --cached | grep -iEq '(secret|token|password|api_key)'; then
            echo "Found potential secrets in diff!"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            git reset
            exit 0
          fi
          git reset

          # Gate: file boundaries
          if git diff --name-only | grep -v '\.log$' | grep -vE '^(src/|scripts/|package\.json|package-lock\.json|eslint\.config\.mjs)'; then
            echo "Modifications outside allowed boundaries!"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.post.outcome == 'success' && steps.dupe.outputs.duplicate != 'true' && steps.check.outputs.proceed == 'true'
        run: |
          BRANCH_NAME="selfheal-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          # Only add intended files, avoiding log files
          git add -A
          git reset pre-healthcheck.log repair.log post-healthcheck.log
          git commit -m "Auto-repair drift"
          git push origin "$BRANCH_NAME"

          TITLE="[Self-Heal] Auto-repair drift"
          if [ "${{ github.event_name }}" == "schedule" ]; then TITLE="[Self-Heal Scheduled] Drift fixes"; fi
          if [ "${{ github.event_name }}" == "workflow_run" ]; then TITLE="[Self-Heal Reactive] CI fix"; fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then TITLE="[Self-Heal Manual] Repair"; fi

          # We need to construct dynamic run URLs for artifacts using the standard github vars
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh pr create --title "$TITLE" \
            --body "Automated self-heal repair. Triggers: ${{ github.event_name }}. Please review [artifact logs]($RUN_URL)." \
            --label "automation" --label "self-heal"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
