name: Compute Schedule
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    if: !startsWith(github.ref_name, 'selfheal-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Duplicate PR Check
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --label self-heal-schedule --state open --json createdAt -q 'length')
          if [ "$count" -gt 0 ]; then
            echo "open_pr=true" >> $GITHUB_OUTPUT
          else
            echo "open_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute New Schedule
        if: steps.check_pr.outputs.open_pr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --legacy-peer-deps
          node scripts/compute_schedule.mjs

      - name: Check Diff
        id: diff
        if: steps.check_pr.outputs.open_pr == 'false'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR
        if: steps.diff.outputs.has_diff == 'true' && steps.check_pr.outputs.open_pr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="selfheal-schedule-$(date +%s)"
          git checkout -b $branch
          git add -A
          git commit -m "Update self-heal schedule"
          git push origin $branch
          gh pr create \
            --title "[Self-Heal Schedule] Update cadence" \
            --body "Updated cadence based on telemetry." \
            --label "automation,self-heal"
