name: Compute Schedule
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: compute-schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-schedule:
    if: github.ref_name == github.event.repository.default_branch && !startsWith(github.ref_name, 'selfheal-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Git Config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Compute Schedule
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute_schedule.mjs

      - name: Check for Duplicate PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --label self-heal-schedule --state open --json number -q 'length')
          if [ "$COUNT" -gt 0 ]; then
            echo "Open self-heal-schedule PR exists. Exiting."
            exit 0
          fi

      - name: Create PR if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff --name-only > changed_files.txt
            if grep -qvE '(\.github/self-heal-schedule\.yml|\.github/workflows/self-heal\.yml)' changed_files.txt; then
              echo "Changes outside allowed files! Aborting."
              exit 1
            fi

            BRANCH="selfheal-schedule-$(date +%s)"
            git checkout -b $BRANCH

            git add .
            git commit -m "Update self-heal schedule"
            git push origin $BRANCH

            gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Adaptive schedule recomputed based on telemetry." --label "automation,self-heal-schedule"
          fi