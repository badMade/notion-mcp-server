name: Compute Schedule

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly recomputation
  workflow_dispatch:

concurrency:
  group: schedule-recompute
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  compute:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute New Schedule
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute_schedule.mjs

      - name: Check for diff
        id: diff_check
        run: |
          if [[ -n $(git status --porcelain .github/self-heal-schedule.yml) ]]; then
            echo "diff_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "diff_exists=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        continue-on-error: true

      - name: Sync Schedule to Workflow
        if: steps.diff_check.outcome == 'success'
        run: |
          NEW_SCHEDULE="${{ steps.compute.outputs.new_schedule }}"
          sed -i "s/.*# AUTO-UPDATED.*/    - cron: '$NEW_SCHEDULE' # AUTO-UPDATED - Do not change this comment/" .github/workflows/self-heal.yml

      - name: Check Duplicate PRs
        id: dup_check
        if: steps.diff_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs=$(gh pr list --label self-heal-schedule --state open --json number -q '. | length')
          if [ "$open_prs" -gt 0 ]; then
             echo "Duplicate schedule PR exists."
             exit 1
          fi

      - name: Configure Git Identity
        if: steps.diff_check.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR
        if: steps.diff_check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE || secrets.GITHUB_TOKEN }}
        run: |
          git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          git commit -m "Update self-heal schedule"

          BRANCH_NAME="selfheal-schedule-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"

          gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Adaptive schedule recomputation based on recent telemetry." --label "self-heal-schedule,automation" --head "$BRANCH_NAME"
