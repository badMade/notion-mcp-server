name: Compute Self-Heal Schedule

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute Schedule
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute_schedule.mjs > compute_schedule.log 2>&1

      - name: Gate Checks & PR Creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .github/workflows/self-heal.yml .github/self-heal-schedule.yml
          if [ -n "$(git status --porcelain -- .github/workflows/self-heal.yml .github/self-heal-schedule.yml)" ]; then
            RECENT_PRS=$(gh pr list --label self-heal-schedule --state open --json createdAt -q 'length' || echo "0")
            if [ "$RECENT_PRS" -gt "0" ]; then exit 0; fi

            BRANCH_NAME="selfheal-schedule-$(date +%s)"
            git checkout -b "$BRANCH_NAME"
            git commit -m "auto: self-healing schedule update"
            git push origin "$BRANCH_NAME"

            gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Automated schedule recalculation based on telemetry. \n\n[View Artifact Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" --label "automation,self-heal-schedule"
          fi

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compute-schedule-logs
          path: compute_schedule.log
