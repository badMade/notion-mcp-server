name: Compute Schedule
on:
  schedule:
    - cron: '0 0 * * 0' # Once a week
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Compute schedule
        run: node scripts/compute_schedule.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b selfheal-schedule-${{ github.run_id }}
            git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
            git commit -m "Update self-heal schedule"
            git push origin selfheal-schedule-${{ github.run_id }}
            gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Automated schedule update based on telemetry." --label "automation,self-heal"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
