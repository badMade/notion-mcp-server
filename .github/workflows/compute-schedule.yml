name: Compute Schedule
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci || npm install js-yaml
      - name: Duplicate PR Check
        id: dupcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --label self-heal-schedule --state open --json number --jq '.[].number') || true
          if [ -n "$prs" ]; then echo "Open schedule PR exists, aborting."; exit 1; fi
      - name: Compute
        run: node scripts/compute_schedule.mjs
      - name: PR Create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b selfheal-schedule-$(date +%s)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update self-heal schedule"
            git push origin HEAD
            gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Computed new schedule based on telemetry." --label "automation" --label "self-heal-schedule"
          fi
