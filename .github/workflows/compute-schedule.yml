name: Compute Schedule
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS-YAML
        run: npm ci

      - name: Compute Schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute_schedule.mjs

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            if git diff --cached --name-only | grep -Ev '^\.github/workflows/self-heal\.yml$|^\.github/self-heal-schedule\.yml$'; then
              echo "Changes outside allowed files."
              exit 1
            fi

            branch="schedule-$(date +%s)"
            git checkout -b $branch
            git commit -m "Update schedule"
            git push origin $branch
            gh pr create --title "[Self-Heal Schedule] Update cadence" \
              --body "Update self-healing cadence." \
              --label "self-heal-schedule"
          fi
