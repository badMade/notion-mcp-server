name: Compute Schedule

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Compute
        run: |
          npm ci --legacy-peer-deps
          node scripts/compute_schedule.mjs

      - name: Create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          if [ -n "$(git status --porcelain)" ]; then
             BRANCH="selfheal-schedule-$(date +%s)"
             git checkout -b $BRANCH
             git commit -m "chore: update schedule"
             git push origin $BRANCH
             gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Schedule updated based on telemetry." --label "self-heal-schedule"
          fi
