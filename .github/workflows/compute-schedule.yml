name: Compute Schedule

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly base recalculation
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: read
    if: secrets.PAT_WITH_WORKFLOW_SCOPE != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install -D js-yaml@4

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for recent open schedule PRs
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
        run: |
          RECENT_PRS=$(gh pr list --label self-heal-schedule --state open)
          if [ -n "$RECENT_PRS" ]; then
            echo "has_recent=true" >> $GITHUB_OUTPUT
          else
            echo "has_recent=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute New Schedule
        if: steps.check_pr.outputs.has_recent != 'true'
        run: node scripts/compute_schedule.mjs
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}

      - name: Update workflow file
        if: steps.check_pr.outputs.has_recent != 'true'
        run: |
          chmod +x scripts/update_workflow_schedule.mjs
          node scripts/update_workflow_schedule.mjs

      - name: Create Pull Request
        if: steps.check_pr.outputs.has_recent != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then

            git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml

            # Allowlist check
            git diff --cached --name-only | while read file; do
              if [[ "$file" != ".github/workflows/self-heal.yml" && "$file" != ".github/self-heal-schedule.yml" ]]; then
                 echo "Illegal file modified in schedule update: $file"
                 exit 1
              fi
            done

            BRANCH_NAME="selfheal-schedule-$(date +%s)"
            git checkout -b $BRANCH_NAME
            git commit -m "chore: update self-heal schedule"
            git push origin $BRANCH_NAME

            gh pr create \
              --title "[Self-Heal Schedule] Update cadence" \
              --body "Automated PR to update the self-healing schedule based on telemetry." \
              --label "automation,self-heal-schedule"
          fi
