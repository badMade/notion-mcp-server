name: Self-Heal Compute Schedule

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly recompute
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: computeschedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-schedule:
    if: (!startsWith(github.ref_name, 'selfheal-schedule-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check for open Schedule PRs
        id: check_prs
        run: |
          OPEN_PRS=$(gh pr list --label self-heal-schedule --state open --json number -q 'length')
          if [ "$OPEN_PRS" -gt "0" ]; then
            echo "Open schedule PR detected. Skipping to avoid thrash."
            echo "continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "continue=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}

      - name: Compute New Schedule
        if: steps.check_prs.outputs.continue == 'true'
        id: compute
        run: node scripts/compute_schedule.mjs

      - name: Verify Git Status
        if: steps.check_prs.outputs.continue == 'true'
        id: verify_diff
        run: |
          git add .
          DIFF=$(git diff --cached --name-only)
          if [ -z "$DIFF" ]; then
             echo "No schedule change, skipping PR."
             echo "valid=false" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          # Allowed files check
          DENIED_FILES=$(git diff --cached --name-only | grep -vE '^(\.github/workflows/self-heal\.yml|\.github/self-heal-schedule\.yml)$' || true)
          if [ ! -z "$DENIED_FILES" ]; then
             echo "Diff contains denied files (only schedule files allowed): $DENIED_FILES"
             echo "valid=false" >> "$GITHUB_OUTPUT"
             exit 0
          fi

          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_prs.outputs.continue == 'true' && steps.verify_diff.outputs.valid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="selfheal-schedule-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: update self-heal cadence"
          git push -u origin "$BRANCH_NAME"

          TITLE="[Self-Heal Schedule] Update cadence based on telemetry"
          BODY="This PR automatically updates the self-heal schedule based on recent repository activity metrics.

          Check \`.github/self-heal-schedule.yml\` for the rationale behind this cadence shift."

          gh pr create --title "$TITLE" --body "$BODY" --label "self-heal-schedule,automation" --head "$BRANCH_NAME" --base main
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE }}
