name: Compute Self-Heal Schedule

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly recompute
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: compute-schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!startsWith(github.ref_name, 'selfheal-')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run schedule computation
        id: compute
        run: |
          ./scripts/compute_schedule.mjs

      - name: Verify Changes
        id: verify_changes
        run: |
          git add .github/workflows/self-heal.yml .github/self-heal-schedule.yml
          changes=$(git diff --name-only --cached)
          if [ -n "$changes" ]; then
             echo "has_changes=true" >> $GITHUB_OUTPUT
          else
             echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.verify_changes.outputs.has_changes == 'true'
        run: |
          branch_name="selfheal-schedule-$(date +%s)"
          git checkout -b "$branch_name"
          git commit -m "chore(self-heal): auto-update cadence schedule"
          git push -u origin "$branch_name"

          gh pr create \
            --title "[Self-Heal Schedule] Update cadence" \
            --body "This PR was automatically generated to update the self-healing schedule based on recent repository telemetry." \
            --label "self-heal" \
            --label "automation" \
            --label "self-heal-schedule"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
