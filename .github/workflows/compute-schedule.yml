name: Compute Schedule
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: read
jobs:
  compute:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install js-yaml
      - run: node scripts/compute_schedule.mjs > compute.log 2>&1
      - id: diff
        run: |
          git reset *.log
          if [ -n "$(git status --porcelain)" ]; then echo "has_diff=true" >> $GITHUB_OUTPUT; else echo "has_diff=false" >> $GITHUB_OUTPUT; fi
      - if: steps.diff.outputs.has_diff == 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OPEN_PRS=$(gh pr list --label self-heal-schedule --state open --json createdAt -q 'length')
          if [ "$OPEN_PRS" -gt "0" ]; then exit 0; fi
          BRANCH_NAME="selfheal-schedule-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git add .github/workflows/self-heal.yml .github/self-heal-schedule.yml
          git commit -m "Update self-heal schedule"
          git push -u origin $BRANCH_NAME
          gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Schedule update." --label "self-heal-schedule"
