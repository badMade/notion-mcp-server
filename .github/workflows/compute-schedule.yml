name: Compute Schedule
on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run schedule recompute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute_schedule.mjs

      - name: Check Diff
        id: check_diff
        run: |
          if [ -n "$(git status --porcelain || true)" ]; then
             echo "changed=true" >> "$GITHUB_OUTPUT"
             git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          else
             echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Duplicate PR
        if: steps.check_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list --label self-heal-schedule --state open --json number --jq 'length' || echo 0)
          if [ "$OPEN_PR" -gt 0 ]; then
            echo "An open schedule PR already exists. Aborting."
            exit 1
          fi

      - name: Create PR
        if: steps.check_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="schedule-update-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "Auto-update self-heal schedule"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "[Self-Heal Schedule] Update cadence" \
            --body "Automatically recomputed schedule based on repo telemetry." \
            --label "automation,self-heal-schedule" \
            --base main