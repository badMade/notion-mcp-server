name: Compute Schedule
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Compute New Schedule
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute_schedule.mjs
      - name: Update Workflow Schedule
        if: steps.compute.outputs.schedule_changed == 'true'
        run: |
          NEW_SCHEDULE=$(cat .github/self-heal-schedule.yml | grep '^schedule:' | sed 's/^schedule:[[:space:]]*//' | sed 's/[[:space:]]*# AUTO-UPDATED//' | tr -d '"'\')
          # Use sed for replacement just for the workflow file based on the marker
          sed -i "s/- cron: .*/- cron: \"$NEW_SCHEDULE\" # Placeholder, actual schedule in .github\/self-heal-schedule.yml/" .github/workflows/self-heal.yml
      - name: Create PR
        if: steps.compute.outputs.schedule_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch_name="selfheal-schedule-$(date +%s)"
          git checkout -b "$branch_name"
          git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          git commit -m "Update self-heal schedule based on telemetry"
          git push origin "$branch_name"
          gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Schedule updated based on telemetry." --label "automation" --label "self-heal-schedule"
