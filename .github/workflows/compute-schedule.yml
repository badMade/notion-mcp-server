name: Compute Schedule
on:
  schedule:
    - cron: '0 0 * * 0' # Weekly
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    if: github.repository == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compute New Schedule
        run: node scripts/compute_schedule.mjs

      - name: Check Diff
        id: diff
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
        continue-on-error: true

      - name: Duplicate PR Check
        id: dupe
        if: steps.diff.outcome == 'success' && steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE || secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --label "self-heal-schedule" --state open | grep -q .; then
            echo "Open schedule PR exists, skipping."
            exit 1
          fi
        continue-on-error: true

      - name: Create Pull Request
        if: steps.dupe.outcome == 'success' && steps.diff.outcome == 'success' && steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_WITH_WORKFLOW_SCOPE || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="schedule-update-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          git commit -m "Update self-heal schedule"
          git push -u origin "$BRANCH_NAME"

          gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Schedule update based on telemetry." --label "self-heal-schedule,automation" --head "$BRANCH_NAME" --base main
