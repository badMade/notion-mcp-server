name: Compute Schedule
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  compute:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run compute
        run: |
          npm ci
          node scripts/compute_schedule.mjs

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="selfheal-schedule-$(date +%s)"
            git checkout -b $BRANCH
            git add .github/self-heal-schedule.yml
            git commit -m "Update self-heal schedule"
            git push -u origin $BRANCH
            gh pr create --title "[Self-Heal Schedule] Update cadence" --body "Schedule recomputed based on telemetry." --label "automation,self-heal"
          fi
