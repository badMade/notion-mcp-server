name: Compute Self-Heal Schedule

on:
  schedule:
    - cron: '0 0 * * *' # Daily check to adapt schedule if needed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: compute-schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check for recent schedule updates
        id: check_oscillation
        run: |
          # Prevent thrashing if we updated schedule very recently
          RECENT_PRS=$(gh pr list --label self-heal-schedule --state open --json number -q 'length')
          if [ "$RECENT_PRS" -gt 0 ]; then
            echo "Existing schedule PR found. Skipping run."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new schedule
        if: steps.check_oscillation.outputs.skip == 'false'
        id: compute
        run: |
          npm ci || npm install
          node scripts/compute_schedule.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Git Diff Scope (Security Gate)
        if: steps.check_oscillation.outputs.skip == 'false' && steps.compute.outputs.changed == 'true'
        id: scope_check
        run: |
          ALLOWED="^\.github/workflows/self-heal\.yml|^\.github/self-heal-schedule\.yml"

          git add .
          CHANGED_FILES=$(git diff --cached --name-only)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes found."
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          for file in $CHANGED_FILES; do
            if ! echo "$file" | grep -qE "$ALLOWED"; then
              echo "Error: Modification to non-allowlisted file $file"
              echo "valid=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Create Schedule Update PR
        if: steps.check_oscillation.outputs.skip == 'false' && steps.compute.outputs.changed == 'true' && steps.scope_check.outputs.valid == 'true'
        run: |
          BRANCH_NAME="schedule-update-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update self-heal schedule cadence"
          git push origin "$BRANCH_NAME"

          TITLE="[Self-Heal Schedule] Update cadence"
          BODY="This PR was automatically generated to adjust the Self-Heal schedule based on recent repository activity.

          New computed schedule: \`${{ steps.compute.outputs.schedule }}\`

          This optimization ensures we don't waste CI minutes on dormant repos, but quickly fix drift on highly active ones."

          gh pr create --title "$TITLE" --body "$BODY" --label "automation,self-heal-schedule" --head "$BRANCH_NAME" --base "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
